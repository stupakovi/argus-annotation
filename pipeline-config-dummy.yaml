# ==============================
# Display / Annotation
# ==============================
display:
  car_bbox_color: [0, 255, 255]
  plate_bbox_color: [0, 255, 0]

# ==============================
# Tracking & Batching
# ==============================
tracking:
  inactive_ttl_frames: 150
  vehicle_classes: [2, 5, 7] # car, bus, truck (removed motorcycle)
  detect_violations_classes: [2, 5, 7] # car, bus, truck
  topk_vehicle_candidates: 10
  crop_margin: 70
  batch_frames: 25
  track_activation_threshold: 0.25
  lost_track_buffer: 25
  minimum_matching_threshold: 0.7
  frame_rate: 25
  minimum_consecutive_frames: 1
  min_detections_to_finalize: 15

# ==============================
# Car Reference Margins (%)
# ==============================
car_reference_margins:
  car_to_first_width_margin: 0.35
  car_to_first_height_margin: 0.90
  car_to_second_width_margin: 0.5
  car_to_second_height_margin: 0.5
  car_from_first_width_margin: 0.5
  car_from_first_height_margin: 0.90
  car_from_second_width_margin: 0.5
  car_from_second_height_margin: 0.5

# ==============================
# Traffic Light Colors
# ==============================
traffic_light:
  max_green_gap_frames: 30
  colors:
    red: "red"
    yellow: "yellow"
    green: "green"

# ==============================
# Finalization / Ray
# ==============================
finalize:
  backend: "ray"
  max_pending: 128
  ray_spill_dir: "/tmp/ray_spill"

# ==============================
# I/O & Preview
# ==============================
io:
  input_video_path: "rtsp://admin:DOM2588205@<FRONT_CAMERA>:554/cam/realmonitor?channel=1&subtype=0"
  input_traffic_light_video_path: "rtsp://admin:DOM2588205@<BACK_CAMERA>:554/cam/realmonitor?channel=1&subtype=0"
  camera_config_path: "configs/<CAMERA_CONFIGS>"
  output_dir: "output-dir"
  per_frame_log_name: "per_frame_log.csv"
  final_objects_name: "final_objects.csv"
  final_json_name: "final_objects.json"
  violations_name: "violations.csv"
  violations_filtered_name: "violations_filtered.csv"
  traffic_light_log_name: "traffic_light_log.csv"
  speeds_json_name: "speeds.jsonl"
  has_passed_line_history_json_name: "has_passed_line_history.jsonl"
  images_dir: "objects"
  use_structured_folders: false
  frame_queue_max_size: 250
  stream_queue_max_size: 25
  pre_buffer_seconds: 5
  days_to_store_runs: 7

# ==============================
# OCR
# ==============================
ocr:
  url: "http://argus-paddle:8008/recognize"
  http_timeout: 8.0

# ==============================
# Models & Thresholds
# ==============================
models:
  car_detection:
    path: "models/yolo11s.pt"
    conf: 0.25
    iou: 0.7
    imgsz: 640
  plate_detection:
    path: "models/license-plate-finetune-v1n.pt"
    conf: 0.25
  tl_classification:
    path: "models/tl_classifier_small_new.pt"
    conf: 0.7
    green_threshold: 0.1
    crop_threshold: 0.3
    model_variant: "small"

# ==============================
# RTSP Reconnects
# ==============================
rtsp:
  reconnect_retries: 20
  reconnect_sleep: 1.0

# ==============================
# Tracking persistence
# ==============================
max_last_seen_frames: 75

ftp:
  delete_local_files_on_upload: false

