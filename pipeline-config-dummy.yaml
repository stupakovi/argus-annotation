video_buffer:
  buffer_duration_minutes: 20
  segment_duration_seconds: 1
  resize_dimensions: [1280, 720]
  frontview_dir: "video_buffer_frontview"
  backview_dir: "video_buffer_backview"
  queue_size: 100

monitoring:
  device_name: "Pipeline {MONITOR_NUMBER}"
  system_monitor_interval_seconds: 15
  business_monitor_interval_seconds: 30
  system_monitor_endpoint: "http://172.18.12.9:8012/api/system-status"
  statistics_monitor_endpoint: "http://172.18.12.9:8012/api/statistics"
  alert_monitor_endpoint: "http://172.18.12.9:8012/api/alerts"
  violation_alert_threshold: 4
  restart_frequency_window_seconds: 90
  ray_error_alert_cooldown_seconds: 300


camera_movement:
  enabled: false
  threshold_pixels: 10
  save_debug_frames: false